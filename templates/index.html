<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snap solve</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <main>
    <h1>snap solve</h1>
    <div class="panel">
      <form action="/upload" method="post" enctype="multipart/form-data">
        <button class="image-picker" type="button" aria-controls="upload-image">
          <img class="action-icon" src="{{ url_for('static', path='/icons/upload.png') }}" alt="">
          Upload image
        </button>
        <input type="file" id="upload-image" name="image" accept="image/jpeg,image/png,image/webp" hidden>
        <p class="selected-file" aria-live="polite">No image selected</p>
        <button type="submit">Continue</button>
      </form>
      <form action="/upload" method="post" enctype="multipart/form-data">
        <button class="image-picker" type="button" aria-controls="take-image">
          <img class="action-icon" src="{{ url_for('static', path='/icons/camera.png') }}" alt="">
          Take image
        </button>
        <input type="file" id="take-image" name="image" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
        <p class="selected-file" aria-live="polite">No image selected</p>
        <button type="submit">Continue</button>
      </form>
    </div>
    <p id="upload-error" role="alert" hidden></p>
    <img id="upload-preview" class="uploaded-image" alt="Uploaded image" hidden>
    <section class="saved-images" aria-labelledby="saved-heading">
      <h2 id="saved-heading">Saved images</h2>
      <p>Saved in this browser. Continue sends an image to Python for processing in memory, without saving it on the server.</p>
      <p id="storage-status" role="status">Loading saved images…</p>
      <ul id="saved-images"></ul>
    </section>
  </main>
  <script src="{{ url_for('static', path='/upload.js') }}"></script>
</body>
</html>
