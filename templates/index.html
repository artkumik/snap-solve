<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>snap solve</title>
  <link rel="stylesheet" href="{{ url_for('static', path='/style.css') }}">
</head>
<body>
  <main>
    <div class="workspace">
      <div id="launch-screen" class="launch-screen">
        <h1>snap solve</h1>
        <p class="launch-intro">Need to check your solution to a math problem?<br>Send over a picture of your work to get started.</p>
        <div class="panel">
          <form action="/upload" method="post" enctype="multipart/form-data">
            <button class="image-picker" type="button" aria-controls="upload-image">
              <span class="action-icon" style="--icon: url('{{ url_for('static', path='/icons/upload.png') }}')" aria-hidden="true"></span>
              Upload
            </button>
            <input type="file" id="upload-image" name="image" accept="image/jpeg,image/png,image/webp" hidden>
            <p class="selected-file" aria-live="polite">No image selected</p>
          </form>
          <form action="/upload" method="post" enctype="multipart/form-data">
            <button class="image-picker" type="button" aria-controls="take-image">
              <span class="action-icon" style="--icon: url('{{ url_for('static', path='/icons/camera.png') }}')" aria-hidden="true"></span>
              Camera
            </button>
            <input type="file" id="take-image" name="image" accept="image/jpeg,image/png,image/webp" capture="environment" hidden>
            <p class="selected-file" aria-live="polite">No image selected</p>
          </form>
        </div>
      </div>
      <p id="upload-error" role="alert" hidden></p>
      <div id="image-result" class="result-layout" hidden>
        <section id="image-pane" class="result-column" aria-labelledby="image-heading">
          <h2 id="image-heading" class="box-heading">Your image</h2>
          <div class="image-stage">
            <img id="upload-preview" class="uploaded-image" alt="Uploaded image" hidden>
            <div id="line-overlays" class="line-overlays" aria-label="Incorrect steps"></div>
          </div>
        </section>
        <div id="result-divider" role="separator" tabindex="0" aria-label="Resize image and solution panes" aria-orientation="vertical" aria-controls="image-pane solution-pane" aria-valuemin="25" aria-valuemax="75" aria-valuenow="50"></div>
        <section id="solution-pane" class="result-column" aria-labelledby="solution-heading">
          <h2 id="solution-heading" class="box-heading">Solution</h2>
          <div id="process-output" aria-live="polite"></div>
        </section>
      </div>
      <section id="video-recommendations" class="video-recommendations" aria-labelledby="video-heading" hidden>
        <h2 id="video-heading" class="box-heading">Related videos</h2>
        <div class="video-grid">
          <div class="video-card">
            <iframe class="video-embed" title="Related video 1" src="about:blank" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-card">
            <iframe class="video-embed" title="Related video 2" src="about:blank" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
          <div class="video-card">
            <iframe class="video-embed" title="Related video 3" src="about:blank" loading="lazy" allow="encrypted-media; picture-in-picture; fullscreen" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          </div>
        </div>
      </section>
    </div>
    <details class="saved-images">
      <summary aria-label="Toggle questions sidebar" title="Toggle questions">
        <svg class="sidebar-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true">
          <rect x="3" y="4" width="18" height="16" rx="3"></rect>
          <path d="M15 4v16"></path>
        </svg>
        <span class="box-heading sidebar-brand">snap solve</span>
      </summary>
      <button id="new-image" class="new-question" type="button">+ New problem</button>
      <h2 class="box-heading saved-heading">Your questions</h2>
      <p id="storage-status" role="status"></p>
      <ul id="saved-images"></ul>
      <div class="sidebar-footer">
        <button id="delete-all-questions" type="button" disabled>Delete all</button>
      </div>
    </details>
  </main>
  <script src="{{ url_for('static', path='/backdrop.js') }}"></script>
  <script src="{{ url_for('static', path='/upload.js') }}"></script>
  <script src="{{ url_for('static', path='/resize.js') }}"></script>
</body>
</html>
